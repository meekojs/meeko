name: Verificación

on:
  push:
    branches: [main]
  pull_request:

# Un nuevo commit sustituye las comprobaciones anteriores de la misma rama o PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=8192

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          build: 'true'
      - name: Test UI, i18n, icon, ESLint and Prettier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .meeko/ci-logs | Out-Null
          pnpm run test:packages 2>&1 | Tee-Object -FilePath .meeko/ci-logs/packages.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test public documentation site
        run: pnpm -F meeko-site run test
      - name: Test documentation content package
        run: pnpm -F meeko-docs-content run test
      - name: Test shared documentation module
        run: pnpm -F meeko-docs run test
      # Without DATABASE_URL the integration tests and the browser E2E of the dashboard are skipped.
      - name: Check and test the documentation dashboard
        run: pnpm -F meeko-dashboard run check && pnpm -F meeko-dashboard run test
      - name: Node adapter conformance
        shell: pwsh
        run: |
          pnpm run conformance:node 2>&1 | Tee-Object -FilePath .meeko/ci-logs/conformance-node.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node packages/meeko/node_modules/playwright-core/cli.js install chromium firefox webkit
      - name: i18n public site E2E
        shell: pwsh
        run: |
          pnpm -F meeko-i18n-site run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MEEKO_CHROME_PATH = node -p "require('./apps/i18n/node_modules/playwright-core').chromium.executablePath()"
          pnpm -F meeko-i18n-site run test:e2e 2>&1 | Tee-Object -FilePath .meeko/ci-logs/i18n-site-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core browser E2E
        shell: pwsh
        run: |
          pnpm run e2e 2>&1 | Tee-Object -FilePath .meeko/ci-logs/browser-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pilot multimotor E2E
        shell: pwsh
        run: |
          pnpm run pilot:e2e 2>&1 | Tee-Object -FilePath .meeko/ci-logs/pilot-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm run package:smoke
      - name: Installed workspace packages consumer
        shell: pwsh
        run: |
          pnpm run package:workspace-smoke 2>&1 | Tee-Object -FilePath .meeko/ci-logs/workspace-consumer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack public artifact
        shell: pwsh
        working-directory: packages/meeko
        run: |
          New-Item -ItemType Directory -Force .meeko/ci-artifacts | Out-Null
          pnpm pack --pack-destination .meeko/ci-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full-stack tarball consumer and browser
        shell: pwsh
        env:
          MEEKO_BROWSER_CHANNEL: chromium
        run: |
          $tarballs = @(Get-ChildItem -LiteralPath packages/meeko/.meeko/ci-artifacts -Filter '*.tgz' -File)
          if ($tarballs.Count -ne 1) { throw "Expected one Meeko tarball, found $($tarballs.Count)." }
          ./packages/meeko/tests/fullstack-consumer.ps1 -Tarball $tarballs[0].FullName
      - name: Diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-test-logs
          path: .meeko/ci-logs/
          if-no-files-found: ignore
      - name: Inspected tarball
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-tarball
          path: packages/meeko/.meeko/ci-artifacts/*.tgz
          if-no-files-found: ignore

  checks:
    name: Types and lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          build: 'true'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules/.cache/eslint
          key: eslint-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.*', 'packages/eslint-plugin/src/**', 'packages/eslint-plugin/scripts/**', 'packages/eslint-plugin/package.json', 'scripts/build-package.mjs') }}-${{ github.sha }}
          restore-keys: eslint-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.*', 'packages/eslint-plugin/src/**', 'packages/eslint-plugin/scripts/**', 'packages/eslint-plugin/package.json', 'scripts/build-package.mjs') }}-
      - run: pnpm lint
      - name: Check every public package and application
        run: pnpm run check && pnpm run check:apps

  test-support:
    name: Test support (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Fixture and process lifecycle contracts
        run: node --test scripts/test-support/test-support.test.ts
      - name: Release asset contracts
        run: pwsh -NoProfile -File scripts/release-assets.test.ps1

  verify:
    name: Verify package and DevTools (${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      MEEKO_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          build: 'true'
      - name: Verify package and DevTools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .meeko/ci-logs | Out-Null
          pnpm run verify:prepared 2>&1 | Tee-Object -FilePath .meeko/ci-logs/verify.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-verify-log-${{ matrix.shard }}
          path: .meeko/ci-logs/verify.log
          if-no-files-found: ignore

  ui-browser:
    name: UI browser E2E (${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          build: 'true'
      - run: node packages/meeko/node_modules/playwright-core/cli.js install chromium
      - name: UI browser E2E
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .meeko/ci-logs | Out-Null
          $env:MEEKO_CHROME_PATH = node -p "require('./packages/ui/node_modules/playwright-core').chromium.executablePath()"
          pnpm -F meeko-ui-site run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # markdown-editor.e2e.mjs reads the output of apps/i18n too.
          pnpm -F meeko-i18n-site run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-shard=${{ matrix.shard }}/3 --test-concurrency=1 packages/ui/tests/*.e2e.mjs packages/icon/tests/*.e2e.mjs 2>&1 | Tee-Object -FilePath .meeko/ci-logs/ui-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-ui-browser-log-${{ matrix.shard }}
          path: .meeko/ci-logs/ui-e2e.log
          if-no-files-found: ignore

  # Conserva el check `test` como resultado único de todos los gates anteriores.
  test:
    needs: [core-tests, checks, test-support, verify, ui-browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          TEST_SUPPORT: ${{ needs.test-support.result }}
          CORE: ${{ needs.core-tests.result }}
          VERIFY: ${{ needs.verify.result }}
          UI_BROWSER: ${{ needs.ui-browser.result }}
        run: |
          test "$CHECKS" = success
          test "$TEST_SUPPORT" = success
          test "$CORE" = success
          test "$VERIFY" = success
          test "$UI_BROWSER" = success

  performance:
    name: Performance budgets
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: node packages/meeko/node_modules/playwright-core/cli.js install chromium
      - name: Measure and compare reproducible performance budgets
        run: pnpm -F @meekojs/meeko run benchmark:budget
        env:
          MEEKO_BROWSER_CHANNEL: chromium
      - name: Performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-performance
          path: |
            packages/meeko/.meeko/performance/current.json
            packages/meeko/.meeko/performance/comparison.json
          if-no-files-found: ignore

  redis-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Redis real session integration
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm -F @meekojs/meeko exec tsx --test tests/redis.integration.ts 2>&1 | tee .meeko/ci-logs/redis.log
        env:
          MEEKO_REDIS_URL: redis://127.0.0.1:6379
      - name: Redis diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-redis-log
          path: .meeko/ci-logs/redis.log
          if-no-files-found: ignore

  bun:
    name: Conformidad Bun
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Bun adapter conformance
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm run conformance:bun 2>&1 | tee .meeko/ci-logs/conformance-bun.log
        env:
          MEEKO_CONFORMANCE_REQUIRE: bun
      - name: Bun diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-conformance-bun-log
          path: .meeko/ci-logs/conformance-bun.log
          if-no-files-found: ignore

  deno:
    name: Conformidad Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - name: Deno adapter conformance
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm run conformance:deno 2>&1 | tee .meeko/ci-logs/conformance-deno.log
        env:
          MEEKO_CONFORMANCE_REQUIRE: deno
      - name: Deno diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-conformance-deno-log
          path: .meeko/ci-logs/conformance-deno.log
          if-no-files-found: ignore

  workerd:
    name: Conformidad workerd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # wrangler (devDependency) brings workerd; D1 and Durable Objects run locally.
      - name: Cloudflare Workers adapter conformance
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm run conformance:workerd 2>&1 | tee .meeko/ci-logs/conformance-workerd.log
        env:
          MEEKO_CONFORMANCE_REQUIRE: workerd
          WRANGLER_SEND_METRICS: 'false'
      - name: workerd diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-conformance-workerd-log
          path: .meeko/ci-logs/conformance-workerd.log
          if-no-files-found: ignore

  vscode-extension:
    name: VS Code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          npm-cache: 'true'
      - run: pnpm run package:vsix
        working-directory: packages/vscode
      - run: pnpm run test:host:isolated
        working-directory: packages/vscode
        if: runner.os != 'Linux'
      - run: xvfb-run -a pnpm run test:host:isolated
        working-directory: packages/vscode
        if: runner.os == 'Linux'
