name: Publicar en npm

on:
  push:
    tags:
      # Sólo etiquetas de versión del paquete (`v1.4.1`): `v*` también encajaba con
      # `vscode-v*`, que publica la extensión en su propio workflow.
      - 'v[0-9]*'

# Mínimo privilegio: cada job amplía sólo lo que necesita. `id-token: write` queda limitado a
# `publish`, que no instala dependencias ni ejecuta código del proyecto, y `contents: write` a
# `github-release`.
permissions:
  contents: read

jobs:
  redis-integration:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Redis real session integration
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm -F @meekojs/meeko exec tsx --test tests/redis.integration.ts 2>&1 | tee .meeko/ci-logs/redis.log
        env:
          MEEKO_REDIS_URL: redis://127.0.0.1:6379
      - name: Redis diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-publish-redis-log
          path: .meeko/ci-logs/redis.log
          if-no-files-found: ignore

  bun:
    name: Conformidad Bun
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Bun adapter conformance
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm run conformance:bun 2>&1 | tee .meeko/ci-logs/conformance-bun.log
        env:
          MEEKO_CONFORMANCE_REQUIRE: bun
      - name: Bun diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-publish-conformance-bun-log
          path: .meeko/ci-logs/conformance-bun.log
          if-no-files-found: ignore

  deno:
    name: Conformidad Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: pnpm install --frozen-lockfile
      - name: Deno adapter conformance
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm run conformance:deno 2>&1 | tee .meeko/ci-logs/conformance-deno.log
        env:
          MEEKO_CONFORMANCE_REQUIRE: deno
      - name: Deno diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-publish-conformance-deno-log
          path: .meeko/ci-logs/conformance-deno.log
          if-no-files-found: ignore

  workerd:
    name: Conformidad workerd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      # wrangler (devDependency) brings workerd; D1 and Durable Objects run locally.
      - run: pnpm install --frozen-lockfile
      - name: Cloudflare Workers adapter conformance
        run: |
          mkdir -p .meeko/ci-logs
          set -o pipefail
          pnpm run conformance:workerd 2>&1 | tee .meeko/ci-logs/conformance-workerd.log
        env:
          MEEKO_CONFORMANCE_REQUIRE: workerd
          WRANGLER_SEND_METRICS: 'false'
      - name: workerd diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-publish-conformance-workerd-log
          path: .meeko/ci-logs/conformance-workerd.log
          if-no-files-found: ignore

  vscode-extension:
    name: VS Code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:vsix
        working-directory: packages/vscode
      - run: pnpm run test:host:isolated
        working-directory: packages/vscode
        if: runner.os != 'Linux'
      - run: xvfb-run -a pnpm run test:host:isolated
        working-directory: packages/vscode
        if: runner.os == 'Linux'

  package-gates:
    name: Gates y tarballs
    needs: [redis-integration, bun, deno, workerd, vscode-extension]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
        with:
          # Hace falta la historia para comprobar que la etiqueta está en main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Comprobar que la etiqueta apunta a un commit de main
        shell: pwsh
        # Una etiqueta sobre otra rama se saltaría los checks requeridos de main (lint, E2E de UI e i18n…).
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:GITHUB_REF_NAME ($env:GITHUB_SHA) no está en main." }
      - name: Comprobar versión de la etiqueta en los seis paquetes
        shell: pwsh
        run: |
          foreach ($name in @('meeko', 'i18n', 'icon', 'ui', 'eslint-plugin', 'prettier-plugin')) {
            $manifest = Get-Content -Raw "packages/$name/package.json" | ConvertFrom-Json
            if ($env:GITHUB_REF_NAME -ne "v$($manifest.version)" -or $manifest.private) {
              throw "La etiqueta $env:GITHUB_REF_NAME no coincide con $($manifest.name) ($($manifest.version))."
            }
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm -F meeko-site run test
      - run: pnpm -F meeko-docs-content run test
      - run: pnpm test:packages
      - run: pnpm package:workspace-smoke
      - name: Verify package and DevTools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .meeko/ci-logs | Out-Null
          pnpm run verify 2>&1 | Tee-Object -FilePath .meeko/ci-logs/verify.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Node adapter conformance
        shell: pwsh
        run: |
          pnpm run conformance:node 2>&1 | Tee-Object -FilePath .meeko/ci-logs/conformance-node.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node packages/meeko/node_modules/playwright-core/cli.js install chromium firefox webkit
      - name: Browser E2E
        shell: pwsh
        run: |
          pnpm run e2e 2>&1 | Tee-Object -FilePath .meeko/ci-logs/browser-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pilot multimotor E2E
        shell: pwsh
        run: |
          pnpm run pilot:e2e 2>&1 | Tee-Object -FilePath .meeko/ci-logs/pilot-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm run package:smoke
      - name: Pack public artifact
        shell: pwsh
        working-directory: packages/meeko
        run: |
          New-Item -ItemType Directory -Force .meeko/ci-artifacts | Out-Null
          pnpm pack --pack-destination .meeko/ci-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full-stack tarball consumer and browser
        shell: pwsh
        env:
          MEEKO_BROWSER_CHANNEL: chromium
        run: |
          $tarballs = @(Get-ChildItem -LiteralPath packages/meeko/.meeko/ci-artifacts -Filter '*.tgz' -File)
          if ($tarballs.Count -ne 1) { throw "Expected one Meeko tarball, found $($tarballs.Count)." }
          ./packages/meeko/tests/fullstack-consumer.ps1 -Tarball $tarballs[0].FullName
      - name: Empaquetar y comprobar los seis tarballs
        shell: pwsh
        run: ./scripts/publish-packages.ps1 -PackOnly -ExpectedVersion ($env:GITHUB_REF_NAME.Substring(1)) -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'npm-tarballs')
      - name: Guardar los tarballs que pasaron los gates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/
          if-no-files-found: error
          overwrite: true
      - name: Diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeko-publish-gate-logs
          path: .meeko/ci-logs/
          if-no-files-found: ignore

  # Job aparte: la aprobación del environment llega con los gates ya en verde, y el token OIDC
  # no está disponible mientras se instalan dependencias o se ejecutan pruebas.
  publish:
    name: Publicar en npm
    environment: npm
    needs: package-gates
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meeko-npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
      - name: Publicar los paquetes pendientes con identidad OIDC
        shell: pwsh
        # npm vincula el Trusted Publisher al repositorio, a este archivo (publish.yml) y al environment `npm`.
        # Configura uno por paquete tras su primera publicación interactiva.
        run: |
          npm install --global npm@11.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/publish-packages.ps1 -Trusted -Execute -ExpectedVersion ($env:GITHUB_REF_NAME.Substring(1)) -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'npm-tarballs')

  github-release:
    name: Release de GitHub con VSIX y ZIP
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Leer versiones
        id: version
        shell: pwsh
        run: |
          $packageVersion = node -p "JSON.parse(require('node:fs').readFileSync('packages/meeko/package.json', 'utf8')).version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con packages/meeko/package.json ($packageVersion)."
          }
          $vscodeVersion = node -p "JSON.parse(require('node:fs').readFileSync('packages/vscode/package.json', 'utf8')).version"
          $devtoolsVersion = node -p "JSON.parse(require('node:fs').readFileSync('packages/devtools/manifest.json', 'utf8')).version"
          "package=$packageVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($packageVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "vscode=$vscodeVersion" >> $env:GITHUB_OUTPUT
          "devtools=$devtoolsVersion" >> $env:GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile
      - name: Empaquetar los seis VSIX y el ZIP de Chrome
        shell: pwsh
        env:
          VSCODE_VERSION: ${{ steps.version.outputs.vscode }}
          DEVTOOLS_VERSION: ${{ steps.version.outputs.devtools }}
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          foreach ($target in @('win32-x64', 'win32-arm64', 'linux-x64', 'linux-arm64', 'darwin-x64', 'darwin-arm64')) {
            pwsh -NoProfile -File packages/vscode/package-vsix.ps1 -Target $target
            if ($LASTEXITCODE -ne 0) { throw "Falló el VSIX $target." }
            $vsix = "packages/vscode/artifacts/meeko-language-$env:VSCODE_VERSION-$target.vsix"
            if (!(Test-Path -LiteralPath $vsix -PathType Leaf)) { throw "Falta $vsix." }
            Copy-Item -LiteralPath $vsix -Destination $assets
          }
          pwsh -NoProfile -File packages/devtools/package-zip.ps1 -OutputPath (Join-Path $assets "meeko-devtools-$env:DEVTOOLS_VERSION.zip")
          if ($LASTEXITCODE -ne 0) { throw 'Falló el ZIP de Chrome DevTools.' }
          $lines = Get-ChildItem -LiteralPath $assets -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          }
          Set-Content -LiteralPath (Join-Path $assets 'SHA256SUMS.txt') -Value $lines -Encoding utf8NoBOM
          Get-ChildItem -LiteralPath $assets -File | Format-Table Name, Length
      - name: Crear o actualizar la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VSCODE_VERSION: ${{ steps.version.outputs.vscode }}
          DEVTOOLS_VERSION: ${{ steps.version.outputs.devtools }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-assets') -File | ForEach-Object FullName)
          if ($assets.Count -ne 8) { throw "Se esperaban 8 archivos (6 VSIX, ZIP y SHA256SUMS); hay $($assets.Count)." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Release ya creada (a mano o en un intento anterior): sólo se reemplazan los adjuntos.
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $distTag = if ($env:PRERELEASE -eq 'true') { 'next' } else { 'latest' }
            $notes = @(
              "Paquete npm: [@meekojs/meeko@$env:PACKAGE_VERSION](https://www.npmjs.com/package/@meekojs/meeko/v/$env:PACKAGE_VERSION) (dist-tag ``$distTag``).",
              '',
              "Adjuntos: extensión de VS Code ``meeko-language`` $env:VSCODE_VERSION (seis VSIX: win32, linux y darwin en x64/arm64) y Meeko DevTools para Chrome $env:DEVTOOLS_VERSION (ZIP), con sus sumas en ``SHA256SUMS.txt``. Las extensiones tienen versión propia y se publican en sus tiendas con las etiquetas ``vscode-v*`` y ``devtools-v*``.",
              '',
              "Cambios: [CHANGELOG.md](https://github.com/$env:GITHUB_REPOSITORY/blob/$tag/packages/meeko/CHANGELOG.md)."
            ) -join "`n"
            $arguments = @('release', 'create', $tag) + $assets + @('--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', $tag, '--notes', $notes)
            $arguments += if ($env:PRERELEASE -eq 'true') { '--prerelease' } else { '--latest' }
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
