name: Publicar extensión de VS Code

# Sólo se ejecuta cuando el mantenedor sube una etiqueta `vscode-v<versión>`. La extensión
# tiene versión propia, independiente del paquete npm. Cada tienda se omite (sin fallar)
# mientras falte su credencial. Visual Studio Marketplace usa Microsoft Entra ID si existen
# AZURE_CLIENT_ID y AZURE_TENANT_ID (OIDC desde el environment `vscode-marketplace`, sin token
# guardado) y, si no, el PAT de VSCE_PAT. Open VSX usa OVSX_PAT.
on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Comprobar versión
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comprobar versión de la etiqueta
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath packages/vscode/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "vscode-v$version") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con packages/vscode/package.json ($version)."
          }
          # Marketplace y Open VSX sólo aceptan major.minor.patch.
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "La versión $version de la extensión no es major.minor.patch; las tiendas no admiten sufijos de prerelease."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  test:
    name: Pruebas (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
        working-directory: packages/vscode
      - run: pnpm run package:vsix
        working-directory: packages/vscode
      - run: pnpm run test:host:isolated
        working-directory: packages/vscode
        if: runner.os != 'Linux'
      - run: xvfb-run -a pnpm run test:host:isolated
        working-directory: packages/vscode
        if: runner.os == 'Linux'

  publish:
    name: Marketplace y Open VSX
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 90
    # La credencial federada de Entra ID confía en este environment
    # (sujeto `repo:meekojs/meeko:environment:vscode-marketplace`).
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Detectar credenciales de las tiendas
        id: stores
        shell: pwsh
        env:
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' }}
          HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
          HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
        run: |
          $entra = $env:HAS_AZURE -eq 'true'
          $vsce = $entra -or $env:HAS_VSCE_PAT -eq 'true'
          $ovsx = $env:HAS_OVSX_PAT -eq 'true'
          "entra=$($entra.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "vsce=$($vsce.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "ovsx=$($ovsx.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "any=$(($vsce -or $ovsx).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (!$vsce) { Write-Output '::notice title=Marketplace omitido::Faltan AZURE_CLIENT_ID y AZURE_TENANT_ID (o VSCE_PAT); no se publica en Visual Studio Marketplace.' }
          elseif (!$entra) { Write-Output '::warning title=Marketplace con PAT::Se publica con VSCE_PAT. Los PAT globales de Azure DevOps se retiran el 1 de diciembre de 2026; configura AZURE_CLIENT_ID y AZURE_TENANT_ID (docs/releasing.md).' }
          if (!$ovsx) { Write-Output '::notice title=Open VSX omitido::Falta el secreto OVSX_PAT; no se publica en Open VSX.' }
      - name: Iniciar sesión en Microsoft Entra ID
        if: steps.stores.outputs.entra == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.stores.outputs.any == 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.stores.outputs.any == 'true'
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.stores.outputs.any == 'true'
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.stores.outputs.any == 'true'
      - name: Empaquetar los seis VSIX
        if: steps.stores.outputs.any == 'true'
        shell: pwsh
        env:
          VSCODE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'vsix'
          New-Item -ItemType Directory -Force $packages | Out-Null
          foreach ($target in @('win32-x64', 'win32-arm64', 'linux-x64', 'linux-arm64', 'darwin-x64', 'darwin-arm64')) {
            pwsh -NoProfile -File packages/vscode/package-vsix.ps1 -Target $target
            if ($LASTEXITCODE -ne 0) { throw "Falló el VSIX $target." }
            $vsix = "packages/vscode/artifacts/meeko-language-$env:VSCODE_VERSION-$target.vsix"
            if (!(Test-Path -LiteralPath $vsix -PathType Leaf)) { throw "Falta $vsix." }
            Copy-Item -LiteralPath $vsix -Destination $packages
          }
          Get-ChildItem -LiteralPath $packages -File | Format-Table Name, Length
      - name: Publicar en Visual Studio Marketplace
        if: steps.stores.outputs.vsce == 'true'
        shell: pwsh
        env:
          # Con Entra ID, vsce toma el token de la sesión de Azure CLI que abrió azure/login; si no,
          # lee el PAT de VSCE_PAT. Ninguno se pasa como argumento.
          VSCE_PAT: ${{ steps.stores.outputs.entra != 'true' && secrets.VSCE_PAT || '' }}
          USE_ENTRA: ${{ steps.stores.outputs.entra }}
          VSCODE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $auth = if ($env:USE_ENTRA -eq 'true') { @('--azure-credential') } else { @() }
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'vsix') -Filter '*.vsix' -File | ForEach-Object FullName)
          if ($packages.Count -ne 6) { throw "Se esperaban 6 VSIX; hay $($packages.Count)." }
          $first = @($packages | Where-Object { $_ -like '*-darwin-arm64.vsix' })
          if ($first.Count -ne 1) { throw 'Falta el VSIX darwin-arm64.' }
          $rest = @($packages | Where-Object { $_ -ne $first[0] })

          function Wait-MarketplaceTargets([string[]] $expected) {
            $deadline = (Get-Date).AddMinutes(25)
            do {
              $visible = @()
              try {
                $json = pnpm dlx '@vscode/vsce@4.0.0' show meekojs.meeko-language --json 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $metadata = $json | ConvertFrom-Json
                  $visible = @($metadata.versions | Where-Object { $_.version -eq $env:VSCODE_VERSION } | ForEach-Object targetPlatform)
                }
              } catch {
                # La primera variante puede no ser visible mientras Marketplace la verifica.
              }
              $missing = @($expected | Where-Object { $_ -notin $visible })
              if ($missing.Count -eq 0) { return }
              if ((Get-Date) -ge $deadline) {
                throw "Marketplace no hizo visibles los paquetes: $($missing -join ', ')."
              }
              Start-Sleep -Seconds 30
            } while ($true)
          }

          # Esperar a que la primera variante sea visible evita perder las demás durante su verificación.
          pnpm dlx '@vscode/vsce@4.0.0' publish @auth --skip-duplicate --packagePath $first[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Wait-MarketplaceTargets @('darwin-arm64')

          pnpm dlx '@vscode/vsce@4.0.0' publish @auth --skip-duplicate --packagePath @rest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Wait-MarketplaceTargets @('darwin-arm64', 'darwin-x64', 'linux-arm64', 'linux-x64', 'win32-arm64', 'win32-x64')
      - name: Publicar en Open VSX
        if: steps.stores.outputs.ovsx == 'true'
        shell: pwsh
        env:
          # ovsx lee el token de OVSX_PAT; nunca se pasa como argumento.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'vsix') -Filter '*.vsix' -File | ForEach-Object FullName)
          if ($packages.Count -ne 6) { throw "Se esperaban 6 VSIX; hay $($packages.Count)." }
          pnpm dlx 'ovsx@1.3.0' publish --skip-duplicate --packagePath @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
