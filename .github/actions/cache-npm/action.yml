name: Cache npm downloads
description: Conserva las descargas de npm usadas al empaquetar VSIX, sin credenciales ni node_modules.
runs:
  using: composite
  steps:
    - id: directory
      shell: pwsh
      run: |
        $cache = npm config get cache
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "path=$cache" >> $env:GITHUB_OUTPUT
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.directory.outputs.path }}/_cacache
        key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'packages/vscode/package.json', 'packages/vscode/package-vsix.ps1') }}
        restore-keys: npm-v1-${{ runner.os }}-${{ runner.arch }}-
