name: Set up workspace
description: Instala Node.js 24 y pnpm 12.14.0, dependencias frozen y las cachés necesarias.
inputs:
  build:
    description: Reutilizar o construir los paquetes del workspace.
    required: false
    default: 'false'
  npm-cache:
    description: Reutilizar las descargas npm de los paquetes VSIX.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 12.14.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: pnpm
    - shell: pwsh
      run: pnpm install --frozen-lockfile
    - if: inputs.build == 'true'
      uses: ./.github/actions/build-workspace
    - if: inputs.npm-cache == 'true'
      uses: ./.github/actions/cache-npm
