# nginx for dist-static/ (`pnpm run build:static`), for example in Coolify's static deployment.
#
# Every page is a folder with index.html (the document) and index.meeko.json (its navigation
# payload). Meeko's client navigation asks for the page with `Accept: application/meeko+json`;
# the map below answers it with the payload. Without it the site still works: the client sees
# HTML and loads the whole document instead.
map $http_accept $meeko_document {
  "~application/meeko\+json" /index.meeko.json;
  default /index.html;
}

server {
  listen 80;
  server_name meeko.diegootayza.com;
  root /usr/share/nginx/html;

  # `/docs/api` → `/docs/api/index.html`, or its payload for a client navigation.
  location / {
    add_header Vary Accept always;
    try_files $uri $uri$meeko_document =404;
  }

  # Vite's hashed bundles never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;
}
