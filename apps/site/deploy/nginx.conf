# nginx for dist-static/ (`pnpm run build:static`), for example in Coolify's static deployment.
#
# Every page is a folder with index.html (the document) and index.meeko.json (its navigation
# payload, which Meeko's client navigation requests as a file). 404.html is the page of
# app/error.meeko for any other URL; it hydrates there and navigates in the client.
#
# Security headers: the static adapter writes them, the Content-Security-Policy with the hashes of
# the pages' inline scripts among them, to dist-static/_meeko/headers.conf (server.headerFiles in
# meeko.config.ts), which this file reads from the web root. An `add_header` in a location drops
# every `add_header` of the server, so each location includes the file; their `always` covers 404
# and other errors.
server {
  listen 80;
  server_name meeko.diegootayza.com;
  root /usr/share/nginx/html;

  # `/docs/api` → `/docs/api/index.html`; `/docs/api/index.meeko.json` is a plain file.
  location / {
    include /usr/share/nginx/html/_meeko/headers.conf;
    try_files $uri $uri/index.html =404;
  }

  # Vite's hashed bundles never change.
  location /assets/ {
    include /usr/share/nginx/html/_meeko/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Deployment files of the build, not pages; a request for them gets the 404 page.
  location ^~ /_meeko/ {
    internal;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;
}
