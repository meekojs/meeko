# Análisis de las webs de meekojs.com en el SonarQube oficial (sonarqube-dev). Lo sube el paso
# `sonarqube` de .woodpecker/web.yml con SONAR_HOST_URL y SONAR_TOKEN de sus secretos.
sonar.projectKey=meekojs-web
sonar.projectName=meekojs.com (webs y documentación)
sonar.sourceEncoding=UTF-8
sonar.sources=apps/meeko,apps/ui,apps/i18n,apps/dashboard,packages/docs/src,packages/docs-content/src,deploy
sonar.tests=apps/meeko/tests,apps/i18n/tests,apps/dashboard/tests,packages/docs-content/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,**/*.e2e.mjs
sonar.exclusions=**/node_modules/**,**/.meeko/**,**/dist/**,**/dist-static/**,**/public/**,**/tests/**,**/*.generated.ts
